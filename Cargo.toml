[workspace]
members = ["crates/phonowire-audiosocket", "crates/phonowire-receiver", "apps/phonowire-capture"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
authors = ["Yuriy Krasilnikov <YuriyKrasilnikov@users.noreply.github.com>"]
repository = "https://github.com/YuriyKrasilnikov/phonowire"
homepage = "https://github.com/YuriyKrasilnikov/phonowire"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
