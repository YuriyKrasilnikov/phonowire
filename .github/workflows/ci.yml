name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.1 fmt --all -- --check
      - run: cargo +1.98.1 build --workspace --all-targets --locked
      - run: cargo +1.98.1 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.98.1 test --workspace --all-targets --locked
      - run: cargo +1.98.1 test --workspace --doc --locked
